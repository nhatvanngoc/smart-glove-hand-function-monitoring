<text x="390" y="302" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="normal">Nen PET/Kapton/vai mong</text>
<line x1="250" y1="314" x2="250" y2="327" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="130" y="330" width="240" height="30" rx="4" fill="#C8E6C9" fill-opacity="0.95" stroke="#333" stroke-width="1.2"/>
<text x="390" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="normal">Tui silicone khi</text>
<line x1="130" y1="153" x2="80" y2="153" stroke="#D7A13B" stroke-width="4"/>
<text x="75" y="146" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#111" font-weight="bold">A</text>
<line x1="370" y1="249" x2="420" y2="249" stroke="#D7A13B" stroke-width="4"/>
<text x="425" y="254" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111" font-weight="bold">B</text>
<text x="250" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Do dien tro A-B; ap luc tang -> dien tro giam</text>
<text x="250" y="450" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1565C0" font-weight="normal">Khuyen nghi cho ban cuoi: on dinh, de hieu chuan</text>
<text x="760" y="62" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Phuong an B: Rang luoc xen ke</text>
<rect x="635" y="90" width="260" height="260" rx="8" fill="#E3F2FD" fill-opacity="1" stroke="#1565C0" stroke-width="1.5"/>
<text x="765" y="375" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="normal">Nen PET/Kapton 50 x 50 mm</text>
