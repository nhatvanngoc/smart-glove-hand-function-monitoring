<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect x="0" y="0" width="1000" height="620" rx="0" fill="#fff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="500.0" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">Cach tao dien cuc cho cam bien Velostat tren moi cell</text>
<text x="250" y="62" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Phuong an A: Sandwich electrode</text>
<rect x="130" y="90" width="240" height="30" rx="4" fill="#F5F5F5" fill-opacity="0.95" stroke="#333" stroke-width="1.2"/>
<text x="390" y="110" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="normal">Lop vai/TPU phu benh nhan</text>
<line x1="250" y1="122" x2="250" y2="135" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="130" y="138" width="240" height="30" rx="4" fill="#D7A13B" fill-opacity="0.95" stroke="#333" stroke-width="1.2"/>
