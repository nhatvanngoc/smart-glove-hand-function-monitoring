<text x="765" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="normal">Velostat 45-50 mm dat len tren</text>
<line x1="675" y1="305" x2="675" y2="355" stroke="#D7A13B" stroke-width="4"/>
<text x="675" y="373" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">A</text>
<line x1="825" y1="305" x2="825" y2="355" stroke="#D7A13B" stroke-width="4"/>
<text x="825" y="373" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">B</text>
<text x="765" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#C62828" font-weight="normal">Hai mang dong khong duoc cham nhau</text>
<text x="765" y="450" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#EF6C00" font-weight="normal">De che tao nhanh, nhung tin hieu kem on dinh hon sandwich</text>
<rect x="70" y="500" width="860" height="78" rx="8" fill="#FFFDE7" fill-opacity="1" stroke="#F9A825" stroke-width="1.2"/>
<text x="500" y="525" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">Goi y cho cell 98 x 98 mm: patch 45 x 45 mm hoac 50 x 50 mm, khong can phu full 98 x 98 mm.</text>
<text x="500" y="550" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">Neu da mua 6 tam 28 x 28 cm: du de lam 5 x 9 va nhieu mau thu/du phong.</text>
<text x="500" y="573" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#C62828" font-weight="normal">Tat ca dong/Velostat phai nam duoi lop vai hoac TPU mong, khong de dong cham truc tiep vao da.</text>
